<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI Study</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="top">
  <span class="brand">AI Study</span>
  <input type="file" id="file" accept=".pdf">
  <button id="up">上传并解析</button>
  <span class="meta" id="upMeta"></span>
  <span class="sep"></span>
  <select id="sec" class="hide" title="章节"></select>
  <label class="inline" for="nq">题数</label>
  <input type="number" id="nq" value="3" min="1" max="10">
  <button id="go" disabled>生成讲义</button>
  <span class="meta" id="goMeta"></span>
</header>

<div class="bar hide" id="pBarWrap"><i id="pBar"></i></div>
<div class="statusline hide" id="runLine">
  <span id="stage">—</span>
  <span class="meta" id="detail"></span>
  <button class="ghost hide" id="stop">停</button>
</div>
<div class="err" id="err"></div>

<main class="cols">
  <aside class="col" id="toc">
    <div class="colhead">目录</div>
    <div id="tocBody" class="pad"></div>
  </aside>
  <section class="col" id="lesson">
    <div class="colhead">讲义</div>
    <div id="lessonBody" class="pad">
      <p class="hint">上传课件 → 选一章 → 生成。</p>
    </div>
  </section>
  <section class="col" id="source">
    <div class="colhead">原文 <span class="meta" id="srcMeta"></span></div>
    <div id="sourceBody" class="pad">
      <p class="hint">生成后这里显示本章原文，点讲义里的「出处」会跳过来并高亮。</p>
    </div>
  </section>
</main>

<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
<script src="/static/grade.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

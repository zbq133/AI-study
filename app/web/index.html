<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI Study</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="top">
  <span class="brand">AI Study</span>
  <input type="file" id="file" accept=".pdf">
  <button id="up">上传并解析</button>
  <span class="meta" id="upMeta"></span>
  <span class="sep"></span>
  <select id="sec" class="hide" title="章节"></select>
  <label class="inline" for="nq">题数</label>
  <input type="number" id="nq" value="3" min="1" max="10">
  <button id="go" disabled>生成讲义</button>
  <span class="meta" id="goMeta"></span>
</header>

<div class="bar hide" id="pBarWrap"><i id="pBar"></i></div>
<div class="statusline hide" id="runLine">
  <span id="stage">—</span>
  <span class="meta" id="detail"></span>
  <button class="ghost hide" id="stop">停</button>
</div>
<div class="err" id="err"></div>

<main class="cols">
  <aside class="col" id="toc">
    <div class="colhead">最近生成</div>
    <div id="histBody" class="hist"></div>
    <div class="colhead">目录</div>
    <div id="tocBody" class="pad"></div>
  </aside>
  <section class="col" id="lesson">
    <div class="colhead">讲义</div>
    <div id="lessonBody" class="pad">
      <p class="hint">上传课件 → 选一章 → 生成。</p>
    </div>
  </section>
  <section class="col" id="source">
    <div class="colhead">原文 <span class="meta" id="srcMeta"></span></div>
    <div id="sourceBody" class="pad">
      <p class="hint">生成后这里显示本章原文，点讲义里的「出处」会跳过来并高亮。</p>
    </div>
  </section>
</main>

<button class="gear" id="gear" title="设置">⚙<span>设置</span></button>

<div class="modal hide" id="setModal">
  <div class="sheet">
    <div class="sheethead">
      <b>设置</b>
      <button class="ghost" id="setClose" title="关掉">×</button>
    </div>

    <div class="sect">
      <div class="secttitle">① 模型接入</div>

      <label class="field">
        <span>接入地址</span>
        <input id="setUrl" type="text" spellcheck="false"
               placeholder="https://api.deepseek.com">
        <em class="src" id="srcUrl"></em>
      </label>

      <label class="field">
        <span>API 密钥</span>
        <input id="setKey" type="password" spellcheck="false" autocomplete="off"
               placeholder="粘贴密钥">
        <em class="src" id="srcKey"></em>
      </label>

      <label class="field">
        <span>模型</span>
        <input id="setModel" type="text" spellcheck="false" list="modelList"
               placeholder="deepseek-chat">
        <datalist id="modelList"></datalist>
        <em class="src" id="srcModel"></em>
      </label>

      <div class="field">
        <span>思考等级</span>
        <div class="seg" id="setEffort"></div>
        <em class="src">认这个参数的模型才生效；不认的话这一次会自动按默认跑，不会报错。</em>
      </div>

      <div class="sheetbar">
        <button id="setSave">保存</button>
        <button class="ghost" id="setTest">测一下模型列表</button>
        <span class="meta" id="setMsg"></span>
      </div>
    </div>
  </div>
</div>

<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/auto-render.min.js"></script>
<script src="/static/grade.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

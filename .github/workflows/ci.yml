name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 只跑 3.12：rapidocr-onnxruntime 的元数据写着 Requires-Python <3.13，
        # 3.13 上 pip 直接解析不出可安装版本（不是代码不兼容，是发行版还没跟上）。
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 客户端那套（pyinstaller / pillow）CI 用不上，只装网页版依赖
          pip install -r requirements.txt

      - name: 跑测试
        env:
          STUDY_LIVE: "0"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:warnings
